<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abreys Field Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',Arial,sans-serif;background:#0d1f14}
#app{display:flex;height:100vh}

/* Sidebar */
#sb{width:240px;min-width:240px;background:#1a3d2b;display:flex;flex-direction:column;
  box-shadow:2px 0 8px rgba(0,0,0,.5);transition:width .2s,min-width .2s;z-index:1000;overflow:hidden}
#sb.hide{width:0;min-width:0}
#sb-head{background:#0d2a1c;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
#sb-head h1{color:#a8d5b5;font-size:13px;font-weight:700;letter-spacing:.5px}
#sb-head p{color:rgba(200,230,200,.45);font-size:10px;margin-top:1px}

.sec{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.lbl{color:rgba(200,230,200,.5);font-size:9px;font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;margin-bottom:5px}

/* Estate select */
#est-sel{width:100%;background:#0d2a1c;color:#c8e6c9;border:1px solid rgba(39,174,96,.35);
  border-radius:4px;padding:5px 7px;font-size:12px;cursor:pointer}

/* Year buttons */
#yr-row{display:flex;flex-wrap:wrap;gap:2px}
.yb{padding:2px 5px;font-size:10px;border-radius:3px;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:rgba(200,230,200,.65);transition:all .12s}
.yb.on{background:#27ae60;border-color:#27ae60;color:#fff;font-weight:600}
.yb:hover:not(.on){background:rgba(39,174,96,.18)}

/* View buttons */
#view-row{display:flex;flex-direction:column;gap:3px}
.vb{padding:6px 8px;border-radius:4px;cursor:pointer;font-size:11px;
  border:1px solid rgba(255,255,255,.12);color:#c8e6c9;
  background:rgba(255,255,255,.05);text-align:left;
  transition:all .12s;display:flex;align-items:center;gap:7px}
.vb.on{background:#27ae60;border-color:#27ae60;font-weight:600}
.vb:hover:not(.on){background:rgba(39,174,96,.18)}
.vdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* Label toggle */
#lbl-row{display:flex;gap:3px}
.lb{flex:1;padding:4px 3px;font-size:10px;border-radius:3px;cursor:pointer;text-align:center;
  border:1px solid rgba(255,255,255,.12);color:rgba(200,230,200,.65);
  background:rgba(255,255,255,.05);transition:all .12s}
.lb.on{background:#1565c0;border-color:#1e88e5;color:#fff;font-weight:600}

/* Crop highlight */
#cs{width:100%;background:#0d2a1c;color:#c8e6c9;border:1px solid rgba(39,174,96,.35);
  border-radius:4px;padding:4px 7px;font-size:11px;margin-bottom:4px}
#cs::placeholder{color:rgba(200,230,200,.35)}
#cl{max-height:130px;overflow-y:auto}
.cc{display:flex;align-items:center;gap:5px;padding:2px 3px;border-radius:3px;
  cursor:pointer;color:#c8e6c9;font-size:11px;transition:background .1s}
.cc:hover{background:rgba(255,255,255,.07)}
.cc.on{background:rgba(39,174,96,.18)}
.csw{width:11px;height:11px;border-radius:2px;flex-shrink:0}

/* Legend */
#leg{flex:1;overflow-y:auto;padding:8px 10px}
#leg-title{color:rgba(200,230,200,.5);font-size:9px;font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;margin-bottom:5px}
.lr{display:flex;align-items:center;gap:5px;padding:1px 0;color:#c8e6c9;font-size:11px}
.lsw{width:11px;height:11px;border-radius:2px;flex-shrink:0}
.lha{margin-left:auto;color:rgba(200,230,200,.45);font-size:10px}

/* Print bar */
#pbar{padding:7px 10px;background:#0d2a1c;border-top:1px solid rgba(255,255,255,.1);
  display:flex;gap:5px;flex-shrink:0}
.pb{flex:1;padding:6px;border-radius:4px;cursor:pointer;font-size:11px;
  font-weight:600;border:none;transition:all .15s}
.pb.a3{background:#27ae60;color:#fff}
.pb.a4{background:rgba(39,174,96,.25);color:#c8e6c9;border:1px solid rgba(39,174,96,.35)}
.pb:hover{filter:brightness(1.12)}

/* Map wrap */
#mw{flex:1;position:relative}
#map{width:100%;height:100%}

/* Map overlay controls */
#mctrl{position:absolute;top:10px;right:10px;z-index:1000;display:flex;flex-direction:column;gap:3px}
.mc{width:28px;height:28px;background:rgba(13,42,28,.92);border:1px solid rgba(39,174,96,.4);
  color:#c8e6c9;border-radius:4px;cursor:pointer;font-size:15px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;transition:background .12s}
.mc:hover{background:rgba(39,174,96,.3)}

/* Sidebar toggle */
#sbt{position:absolute;top:10px;left:10px;z-index:1001;background:rgba(13,42,28,.92);
  border:1px solid rgba(39,174,96,.4);color:#c8e6c9;border-radius:4px;
  width:28px;height:28px;cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center}

/* Field popup */
#fpop{position:absolute;bottom:10px;left:10px;z-index:1000;
  background:rgba(13,42,28,.96);border:1px solid rgba(39,174,96,.4);
  border-radius:6px;padding:10px 12px;color:#c8e6c9;font-size:11px;
  max-width:260px;display:none;backdrop-filter:blur(4px)}
#fpop h3{font-size:12px;color:#a8d5b5;margin-bottom:5px}
.fpr{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.fpl{color:rgba(200,230,200,.45)}
.fpv{font-weight:600}
.fpc{position:absolute;top:5px;right:7px;cursor:pointer;
  color:rgba(200,230,200,.45);font-size:13px}
.cur{color:#a8d5b5!important}

/* Leaflet label */
.fl-label{
  background:transparent!important;border:none!important;box-shadow:none!important;
}
.fl-label div{
  font-size:9px;font-weight:700;color:#fff;
  text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000;
  white-space:nowrap;pointer-events:none;text-align:center;line-height:1.2;
}

/* Print */
/* ── Mobile: controls above map ── */
@media (max-width: 768px) {
  #mob-toggle { display: flex !important; }
  #app { flex-direction: column; }
  #sb {
    width: 100% !important;
    min-width: 100% !important;
    max-height: 45vh;
    overflow-y: auto;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 0;
  }
  #sb.hide { max-height: 0; overflow: hidden; min-width: 100% !important; }
  #sb-head { width: 100%; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; }
  #sb-head h1 { font-size: 12px; }
  #sb-head p { display: none; }
  .sec { flex: 1; min-width: 140px; padding: 6px 8px; border-bottom: none; border-right: 1px solid rgba(255,255,255,.07); }
  #leg { min-width: 140px; flex: 1; }
  #pbar { width: 100%; }
  #mw { flex: 1; min-height: 55vh; }
  #sbt { display: none !important; }
  #mctrl { top: 6px; right: 6px; }
}
@media print{
  @page{margin:0}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  #sb,#mctrl,#sbt,#fpop,#pbar{display:none!important}
  #app{display:block}
  #mw,#map{width:100vw!important;height:100vh!important}
}
</style>
</head>
<body>
<div id="app">
<div id="sb">
  <div id="sb-head">
    <h1>&#127807; Abreys Field Map</h1>
    <p>Interactive crop planning map</p>
  </div>

  <div class="sec">
    <div class="lbl">Estate</div>
    <select id="est-sel" onchange="go('estate',this.value)">
      <option>Wretham</option><option>Euston</option><option>Chandler</option>
      <option>Rackham Farms</option><option>Pickenham</option><option>Gooderham</option>
      <option>Blakeney</option><option>Beard</option><option>Warren</option>
      <option>David Hill</option><option>Edwardstone/Borehouse</option>
    </select>
  </div>

  <div class="sec">
    <div class="lbl">Year</div>
    <div id="yr-row"></div>
  </div>

  <div class="sec">
    <div class="lbl">View</div>
    <div id="view-row">
      <button class="vb on" data-v="all" onclick="go('view','all')">
        <span class="vdot" style="background:#27ae60"></span>All Crops
      </button>
      <button class="vb" data-v="ours" onclick="go('view','ours')">
        <span class="vdot" style="background:#1565c0"></span>Our Crops Only
      </button>
      <button class="vb" data-v="partner" onclick="go('view','partner')">
        <span class="vdot" style="background:#7B2FBE"></span>Partner Fields
      </button>
      <button class="vb" data-v="greening" onclick="go('view','greening')">
        <span class="vdot" style="background:#e74c3c"></span>Greening / ST
      </button>
      <button class="vb" id="env-btn" onclick="toggleEnv()" style="border-style:dashed">
        <span class="vdot" style="background:#FF8F00"></span>Environmental Margins
      </button>
    </div>
  </div>

  <div class="sec">
    <div class="lbl">Field Labels</div>
    <div id="lbl-row" style="display:flex;flex-direction:column;gap:5px">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#c8e6c9;font-size:11px"><input type="checkbox" id="lbl-name" checked onchange="toggleLabel('name',this.checked)"> Field Name</label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#c8e6c9;font-size:11px"><input type="checkbox" id="lbl-area" onchange="toggleLabel('area',this.checked)"> Area (ha)</label>
    </div>
  </div>

  <div class="sec">
    <div class="lbl">Highlight Crop</div>
    <input id="cs" type="text" placeholder="Search crops&#8230;" oninput="filterCrops(this.value)">
    <div id="cl"></div>
  </div>

  <div id="leg">
    <div id="leg-title">Crop Areas</div>
    <div id="leg-rows"></div>
  </div>

  <div id="pbar">
    <button class="pb a3" onclick="doPrint('A3')">&#128438; Print A3</button>
    <button class="pb a4" onclick="doPrint('A4')">&#128438; Print A4</button>
    <button class="pb" id="prev-btn" onclick="togglePreview()" style="background:rgba(30,100,200,.25);color:#aac4f0;border:1px solid rgba(30,100,200,.5)">&#9635; Preview</button>
  </div>
</div>

<div id="mw">
  <button id="sbt" onclick="toggleSb()" title="Toggle sidebar">&#9776;</button>
  <button id="mob-toggle" onclick="toggleSb()" style="display:none;position:absolute;top:6px;left:6px;z-index:1001;background:rgba(13,42,28,.92);border:1px solid rgba(39,174,96,.4);color:#c8e6c9;border-radius:4px;width:28px;height:28px;cursor:pointer;font-size:14px;align-items:center;justify-content:center">&#9660;</button>
  <div id="map"></div>
  <div id="env-legend" style="display:none;position:absolute;top:10px;left:10px;z-index:900;background:rgba(13,30,18,.92);border:1px solid rgba(255,143,0,.4);border-radius:6px;padding:8px 10px;min-width:130px;pointer-events:none"></div>
  <div id="print-preview" style="display:none;position:absolute;pointer-events:none;z-index:800;border:2px dashed rgba(30,100,200,0.8);box-shadow:0 0 0 9999px rgba(0,0,0,0.15);border-radius:2px"><div id="print-preview-label" style="position:absolute;top:-22px;left:0;background:rgba(30,100,200,0.85);color:#fff;font-size:10px;padding:2px 8px;border-radius:3px 3px 0 0;white-space:nowrap"></div></div>
  <div id="mctrl">
    <button class="mc" onclick="map.zoomIn(0.1)" title="Zoom in">+</button>
    <button class="mc" onclick="map.zoomOut(0.1)" title="Zoom out">&#8722;</button>
    <button class="mc" onclick="fitEst()" title="Fit to estate" style="font-size:10px">&#9654;&#9654;</button>
  </div>
  <div id="fpop">
    <span class="fpc" onclick="closePop()">&#10005;</span>
    <h3 id="fp-name"></h3>
    <div id="fp-rows"></div>
  </div>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
